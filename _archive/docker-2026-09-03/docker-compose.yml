# Toutes les données vivent dans ./data et ./backups, sur le disque de l'hôte.
# Aucun volume nommé : ce qui est écrit dans le conteneur est immédiatement
# visible dans l'explorateur de fichiers, sauvegardable et copiable tel quel.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bantu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: bantuhub
      READONLY_PASSWORD: ${READONLY_PASSWORD:-lecture_seule}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:-metabase}
      TZ: ${TZ:-Africa/Brazzaville}
    ports:
      # Exposé sur la boucle locale uniquement : accessible depuis pgAdmin,
      # DBeaver ou `npm run dev` sur l'hôte, jamais depuis le réseau.
      - '127.0.0.1:5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # Les sauvegardes sont écrites depuis le conteneur directement sur l'hôte.
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bantu -d bantuhub']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bantu:${POSTGRES_PASSWORD}@db:5432/bantuhub
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET manquant}
      AUTH_TRUST_HOST: 'true'
      TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET manquant}
      APP_URL: ${APP_URL:-http://localhost}
      NEXTAUTH_URL: ${APP_URL:-http://localhost}
      # Connexion Google. Vides = seul l'e-mail + mot de passe est proposé.
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-bantuhub2025}
      # Assistant de la FAQ. Vide = repli sur la recherche dans la page, sans appel externe.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Centre de notifications. Vides = messages gardés en attente.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_TOKEN: ${SMS_WEBHOOK_TOKEN:-}
      UPLOAD_DIR: /data/uploads
      TZ: ${TZ:-Africa/Brazzaville}
    volumes:
      # Même dossier qu'en développement local (lib/uploads.ts y pointe par
      # défaut) : les productions des apprenants sont au même endroit dans les
      # deux modes.
      - ./data/uploads:/data/uploads

  metabase:
    image: metabase/metabase:v0.50.26
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-metabase}
      MB_DB_HOST: db
      MB_SITE_URL: ${APP_URL:-http://localhost}/bi
      JAVA_TIMEZONE: ${TZ:-Africa/Brazzaville}
      TZ: ${TZ:-Africa/Brazzaville}
    volumes:
      - ./data/metabase:/plugins

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
      - metabase
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Contient les certificats TLS obtenus par Caddy : à conserver.
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
